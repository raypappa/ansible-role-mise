---
name: Windows Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PY_COLORS: "1"
  ANSIBLE_FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install linting tools
        run: pip install ansible-core ansible-lint yamllint

      - name: Run yamllint
        run: yamllint .

      - name: Run ansible-lint
        run: ansible-lint

  windows:
    name: "Windows (${{ matrix.method }})"
    needs: lint
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        method:
          - scoop
          - winget
          - manual

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Ansible
        run: |
          pip install ansible-core pywinrm

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install ansible.windows
          ansible-galaxy collection install community.windows

      - name: Create test playbook
        shell: pwsh
        run: |
          @'
          ---
          - name: Test mise installation on Windows
            hosts: localhost
            connection: local
            gather_facts: true
            tasks:
              - name: Include mise role
                ansible.builtin.include_role:
                  name: mise
                vars:
                  mise_install_method: "${{ matrix.method }}"
                  mise_install_scope: global

              - name: Verify mise binary exists
                ansible.windows.win_stat:
                  path: "C:\\Users\\{{ ansible_user_id }}\\AppData\\Local\\mise\\mise.exe"
                register: _mise_stat

              - name: Assert mise binary exists
                ansible.builtin.assert:
                  that:
                    - _mise_stat.stat.exists
                  fail_msg: "mise binary not found"

              - name: Get mise version
                ansible.builtin.win_shell: "& mise --version"
                register: _mise_version
                changed_when: false

              - name: Assert mise version is reported
                ansible.builtin.assert:
                  that:
                    - "'mise' in _mise_version.stdout or 'v' in _mise_version.stdout"
                  fail_msg: "mise --version failed"

              - name: Display version
                ansible.builtin.debug:
                  msg: "mise version: {{ _mise_version.stdout }}"
          '@ | Out-File -FilePath test_windows.yml -Encoding utf8

      - name: Run test playbook
        run: ansible-playbook test_windows.yml -vvv

      - name: Clean up
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "C:\Users\${{ env.USERNAME }}\AppData\Local\mise") {
            Remove-Item -Path "C:\Users\${{ env.USERNAME }}\AppData\Local\mise" -Recurse -Force
          }
