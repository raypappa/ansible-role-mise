---
name: Windows Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PY_COLORS: "1"
  ANSIBLE_FORCE_COLOR: "1"
  PYTHONUTF8: "1"

jobs:
  windows:
    name: "Windows (${{ matrix.method }})"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        method:
          - scoop
          - winget
          - manual

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Install mise
        shell: pwsh
        run: |
          switch ("${{ matrix.method }}") {
            "scoop" { scoop install mise }
            "winget" { winget install jdx.mise }
            "manual" { irm https://mise.run | pwsh }
          }

      - name: Create test playbook
        shell: pwsh
        run: |
          $playbook = @"
          - name: Test mise installation on Windows
            hosts: localhost
            connection: local
            gather_facts: true
            tasks:
              - name: Verify mise binary exists
                ansible.builtin.shell: "where mise"
                register: _mise_path
                failed_when: _mise_path.rc != 0
              - name: Get mise version
                ansible.builtin.shell: "& mise --version"
                register: _mise_version
                changed_when: false
              - name: Display version
                ansible.builtin.debug:
                  msg: "mise version: {{ _mise_version.stdout }}"
          "@ | Out-File -FilePath test_windows.yml -Encoding utf8

      - name: Run test playbook
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = "1"
          $env:PYTHONIOENCODING = "utf-8"
          python .github/workflows/run_playbook.py test_windows.yml -vvv

      - name: Clean up
        if: always()
        shell: pwsh
        run: |
          $misePath = "C:\Users\$env:USERNAME\AppData\Local\mise"
          if (Test-Path $misePath) {
            Remove-Item -Path $misePath -Recurse -Force
          }
