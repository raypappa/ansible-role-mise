---
name: Windows Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PY_COLORS: "1"
  ANSIBLE_FORCE_COLOR: "1"
  PYTHONUTF8: "1"

jobs:
  windows:
    name: "Windows (${{ matrix.method }})"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        method:
          - scoop
          - winget
          - manual

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Create Unix module stubs
        shell: pwsh
        run: |
          $sitePackages = python -c "import site; print(site.getsitepackages()[0])"
          Write-Host "Creating Unix module stubs in: $sitePackages"

          # fcntl stub
          @"
          F_SETFL = 4
          O_NONBLOCK = 2048
          def fcntl(*args, **kwargs): pass
          def ioctl(*args, **kwargs): return 0
          "@ | Out-File -FilePath (Join-Path $sitePackages "fcntl.py") -Encoding utf8 -Force

          # termios stub
          @"
          TCSANOW = 0
          TCSADRAIN = 1
          TCSAFLUSH = 2
          TCIFLUSH = 0
          TCIOFLUSH = 2
          TCOFLUSH = 1
          B0 = 0
          B9600 = 9600
          B115200 = 115200
          VMIN = 6
          VTIME = 5
          def tcgetattr(*args, **kwargs): return []
          def tcsetattr(*args, **kwargs): pass
          def tcsendbreak(*args, **kwargs): pass
          def tcdrain(*args, **kwargs): pass
          def tcflush(*args, **kwargs): pass
          def tcflow(*args, **kwargs): pass
          "@ | Out-File -FilePath (Join-Path $sitePackages "termios.py") -Encoding utf8 -Force

          # resource stub
          @"
          RLIMIT_NOFILE = 4
          RLIMIT_NPROC = 6
          RLIMIT_CPU = 0
          RLIMIT_FSIZE = 1
          RLIMIT_STACK = 3
          RLIMIT_AS = 5
          RLIM_INFINITY = 18446744073709551615
          def getrlimit(*args, **kwargs): return (RLIM_INFINITY, RLIM_INFINITY)
          def setrlimit(*args, **kwargs): pass
          def getrusage(*args, **kwargs):
              class usage:
                  ru_maxrss = 0
                  ru_utime = 0
                  ru_stime = 0
              return usage()
          "@ | Out-File -FilePath (Join-Path $sitePackages "resource.py") -Encoding utf8 -Force

          # pwd stub
          @"
          def getpwnam(*args, **kwargs):
              import os
              uid = os.getuid() if hasattr(os, 'getuid') else 0
              return ('', '', uid, uid, '', '', '')
          def getpwuid(*args, **kwargs):
              return ('', '', 0, 0, '', '', '')
          "@ | Out-File -FilePath (Join-Path $sitePackages "pwd.py") -Encoding utf8 -Force

          # grp stub
          @"
          def getgrnam(*args, **kwargs):
              import os
              gid = os.getgid() if hasattr(os, 'getgid') else 0
              return ('', '', gid, [])
          def getgrgid(*args, **kwargs):
              return ('', '', 0, [])
          "@ | Out-File -FilePath (Join-Path $sitePackages "grp.py") -Encoding utf8 -Force

          # crypt stub
          @"
          def crypt(word, salt=None): return ''
          "@ | Out-File -FilePath (Join-Path $sitePackages "crypt.py") -Encoding utf8 -Force

          # syslog stub
          @{
              LOG_EMERG = 0
              LOG_ALERT = 1
              LOG_CRIT = 2
              LOG_ERR = 3
              LOG_WARNING = 4
              LOG_NOTICE = 5
              LOG_INFO = 6
              LOG_DEBUG = 7
          }.Keys | ForEach-Object {
              # Just create a minimal stub
          }
          @"
          LOG_EMERG = 0
          LOG_ALERT = 1
          LOG_CRIT = 2
          LOG_ERR = 3
          LOG_WARNING = 4
          LOG_NOTICE = 5
          LOG_INFO = 6
          LOG_DEBUG = 7
          LOG_PID = 1
          LOG_CONS = 2
          LOG_NDELAY = 8
          LOG_ODELAY = 4
          LOG_NOWAIT = 16
          LOG_KERN = 0
          LOG_USER = 8
          LOG_MAIL = 16
          LOG_DAEMON = 32
          LOG_AUTH = 64
          LOG_SYSLOG = 128
          LOG_LPR = 192
          LOG_LOCAL0 = 1280
          LOG_LOCAL1 = 1344
          LOG_LOCAL2 = 1408
          LOG_LOCAL3 = 1472
          LOG_LOCAL4 = 1536
          LOG_LOCAL5 = 1600
          LOG_LOCAL6 = 1664
          LOG_LOCAL7 = 1728
          def syslog(*args, **kwargs): pass
          def openlog(*args, **kwargs): pass
          def closelog(*args, **kwargs): pass
          def setlogmask(*args, **kwargs): pass
          "@ | Out-File -FilePath (Join-Path $sitePackages "syslog.py") -Encoding utf8 -Force

      - name: Create test playbook
        shell: pwsh
        run: |
          $playbook = @"
          - name: Test mise installation on Windows
            hosts: localhost
            connection: local
            gather_facts: true
            tasks:
              - name: Verify mise binary exists
                ansible.builtin.shell: "where mise"
                register: _mise_path
                failed_when: _mise_path.rc != 0
              - name: Get mise version
                ansible.builtin.shell: "& mise --version"
                register: _mise_version
                changed_when: false
              - name: Display version
                ansible.builtin.debug:
                  msg: "mise version: {{ _mise_version.stdout }}"
          "@ | Out-File -FilePath test_windows.yml -Encoding utf8

      - name: Run test playbook
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = "1"
          $env:PYTHONIOENCODING = "utf-8"
          python .github/workflows/run_playbook.py test_windows.yml -vvv

      - name: Clean up
        if: always()
        shell: pwsh
        run: |
          $misePath = "C:\Users\$env:USERNAME\AppData\Local\mise"
          if (Test-Path $misePath) {
            Remove-Item -Path $misePath -Recurse -Force
          }
