---
name: Windows Tests

on:
  workflow_dispatch:
    inputs:
      method:
        description: "Installation method to test"
        required: true
        default: "manual"
        type: choice
        options:
          - scoop
          - winget
          - manual

# NOTE: Windows tests are disabled on push/PR due to Ansible's deep
# reliance on Unix-only modules (fork, libc, termios, etc.) that cannot
# be stubbed on Windows. Re-enable when ansible-core adds proper
# Windows support, or when running via WSL.
#
# To run manually: gh workflow run windows.yml -f method=manual

env:
  PY_COLORS: "1"
  ANSIBLE_FORCE_COLOR: "1"
  PYTHONUTF8: "1"

jobs:
  windows:
    name: "Windows (${{ inputs.method }})"
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Create test playbook
        shell: pwsh
        run: |
          $playbook = @"
          - name: Test mise installation on Windows
            hosts: localhost
            connection: local
            gather_facts: true
            tasks:
              - name: Verify mise binary exists
                ansible.builtin.shell: "where mise"
                register: _mise_path
                failed_when: _mise_path.rc != 0
              - name: Get mise version
                ansible.builtin.shell: "& mise --version"
                register: _mise_version
                changed_when: false
              - name: Display version
                ansible.builtin.debug:
                  msg: "mise version: {{ _mise_version.stdout }}"
          "@ | Out-File -FilePath test_windows.yml -Encoding utf8

      - name: Run mise setup
        shell: pwsh
        run: |
          switch ("${{ inputs.method }}") {
            "scoop" { scoop install mise }
            "winget" { winget install jdx.mise }
            "manual" {
              irm https://mise.run | pwsh
            }
          }

      - name: Verify mise installation
        shell: pwsh
        run: |
          mise --version
          Write-Host "mise is installed and working"

      - name: Clean up
        if: always()
        shell: pwsh
        run: |
          $misePath = "C:\Users\$env:USERNAME\AppData\Local\mise"
          if (Test-Path $misePath) {
            Remove-Item -Path $misePath -Recurse -Force
          }
