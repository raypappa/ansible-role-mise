---
name: Windows Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PY_COLORS: "1"
  ANSIBLE_FORCE_COLOR: "1"
  PYTHONUTF8: "1"

jobs:
  windows:
    name: "Windows (${{ matrix.method }})"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        method:
          # - manual
          # - scoop
          - winget

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # - name: Install mise (scoop)
