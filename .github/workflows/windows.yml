      #   shell: pwsh
      #   run: |
      #     $playbook = @"
      #     - name: Test mise installation on Windows
      #       hosts: localhost
      #       connection: local
      #       gather_facts: true
      #       tasks:
      #         - name: Verify mise binary exists
