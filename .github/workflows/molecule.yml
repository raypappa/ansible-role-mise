---
name: Linux Molecule Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # Weekly on Monday

env:
  PY_COLORS: "1"
  ANSIBLE_FORCE_COLOR: "1"
  PYTHONUTF8: "1"

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: uv sync

      - name: Run pre-commit
        uses: pre-commit/action@v3

  molecule:
    name: Molecule
    needs: pre-commit
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: uv sync

      - name: Run Molecule tests
        run: molecule test

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: molecule-logs
          path: |
            ~/.cache/molecule/
            /tmp/molecule-*

  report:
    name: Test Results
    needs: molecule
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check molecule results
        run: |
          if [ "${{ needs.molecule.result }}" != "success" ]; then
            echo "Molecule tests failed"
            exit 1
          fi
          echo "All Molecule tests passed"

  galaxy:
    name: Publish to Galaxy
    needs: report
    if: github.ref == 'refs/heads/main' && needs.report.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Login to Ansible Galaxy
        uses: Ansible.awesome-actions@v2
        with:
          galaxy-token: ${{ secrets.GALAXY_TOKEN }}

      - name: Publish role to Galaxy
        uses: rlease/actions-publish-ansible-role-to-galaxy@v1
        with:
          role_path: .
          galaxy-username: your-galaxy-username
          galaxy-token: ${{ secrets.GALAXY_TOKEN }}