---
name: Molecule Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # Weekly on Monday

env:
  PY_COLORS: "1"
  ANSIBLE_FORCE_COLOR: "1"
  PYTHONUTF8: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run pre-commit
        run: uv run pre-commit run -a

  molecule:
    name: Linux Molecule
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run Molecule tests
        run: uv run molecule test

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: molecule-logs
          path: |
            ~/.cache/molecule/

  # windows:
  #   name: "Windows Molecule (${{ matrix.method }})"
  #   runs-on: windows-latest
  #   needs: lint
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       method:
  #         # - manual
  #         # - scoop
  #         - winget
  #
  #   steps:
  #     - name: Check out code
  #       uses: actions/checkout@v7.0.1
  #
  #     - name: Set up Python and uv
  #       uses: astral-sh/setup-uv@v10.0.1
  #       with:
  #         enable-cache: true
  #
  #     - name: Install dependencies
  #       run: uv sync
  #
  #     - name: Run test playbook
  #       shell: pwsh
  #       run: uv run molecule test -s windows

  report:
    name: Test Results
    needs: molecule
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check molecule results
        run: |
          if [ "${{ needs.molecule.result }}" != "success" ]; then
            echo "Molecule tests failed"
            exit 1
          fi
          echo "All Molecule tests passed"

  galaxy:
    name: Publish to Galaxy
    needs: report
    if: github.ref == 'refs/heads/main' && needs.report.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install ansible-core
        run: uv pip install ansible-core

      - name: Publish role to Galaxy
        run: ansible-galaxy role publish --token=${{ secrets.GALAXY_TOKEN }} .
