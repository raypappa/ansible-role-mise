authors = [
  { name = "Craig Davis", email = "181794460+raypappa@users.noreply.github.com" },
]
requires-python = "~=3.13.0"
dependencies = [
  "ansible-core>=2.21.3",
  "ansible-lint>=26.8.0",
  "docker>=7.2.0",
  "molecule>=26.8.0",
  "testinfra>=6.0.0",
  "yamllint>=1.38.0",
]

[tool.ruff]
# Ignore E402 (module level import not at top of file) for Ansible modules
# This is standard pattern for Ansible modules with DOCUMENTATION/EXAMPLES/RETURN
[tool.ruff.lint.per-file-ignores]
"library/*.py" = ["E402"]
".github/workflows/run_playbook.py" = ["E402"]
