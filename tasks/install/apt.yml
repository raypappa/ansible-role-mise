---
- name: Install prerequisites (Debian)
  ansible.builtin.apt:
    name:
      - curl
      - gpg
      - sudo
    state: present
    update_cache: true
  become: true
  when: ansible_os_family == 'Debian'

- name: Add mise APT repository key
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://mise.jdx.dev/gpg-key.pub | gpg --dearmor -o /usr/share/keyrings/mise-archive-keyring.gpg
  args:
    executable: /bin/bash
    creates: /usr/share/keyrings/mise-archive-keyring.gpg
  become: true

- name: Add mise APT repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/mise-archive-keyring.gpg]
      https://mise.jdx.dev/deb stable main
    state: present
    filename: mise
  become: true

- name: Install mise via APT
  ansible.builtin.apt:
    name: "{{ 'mise=' + mise_version if mise_version | length > 0 else 'mise' }}"
    state: "{{ 'present' if mise_version | length > 0 else 'latest' }}"
    update_cache: true
  become: true
  notify: Reload shell RC
